<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0f1a12"/>
      <stop offset="100%" stop-color="#070f08"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9432e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e9432e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>

  <g fill="none" stroke="#e9432e" stroke-opacity="0.5" stroke-width="2">
    <circle cx="400" cy="200" r="150"/>
    <circle cx="400" cy="200" r="110"/>
    <circle cx="400" cy="200" r="70"/>
    <circle cx="400" cy="200" r="30"/>
  </g>
  <g stroke="#e9432e" stroke-opacity="0.35" stroke-width="1">
    <line x1="250" y1="200" x2="550" y2="200"/>
    <line x1="400" y1="50" x2="400" y2="350"/>
  </g>
  <path d="M400 200 L400 50 A150 150 0 0 1 550 200 Z" fill="url(#sweep)"/>
  <circle cx="470" cy="150" r="7" fill="#34d399" filter="url(#glow)"/>
  <circle cx="340" cy="260" r="5" fill="#34d399" opacity="0.8"/>
  <circle cx="400" cy="200" r="6" fill="#e9432e" filter="url(#glow)"/>
  <circle cx="646" cy="94" r="7" fill="#34d399" opacity="0.7"/>
</svg>