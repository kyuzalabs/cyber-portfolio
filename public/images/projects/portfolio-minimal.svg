<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <circle cx="400" cy="200" r="150" fill="#e9432e" opacity="0.14" filter="url(#glow)"/>

  <rect x="320" y="120" width="160" height="160" fill="none" stroke="#e7e7e7" stroke-width="2" transform="rotate(45 400 200)"/>
  <rect x="355" y="155" width="90" height="90" fill="#1a1a1a" stroke="#555555" stroke-width="1.5"/>
  <circle cx="400" cy="200" r="30" fill="none" stroke="#8a8a8a" stroke-width="3"/>
  <circle cx="400" cy="200" r="8" fill="#e9432e"/>

  <line x1="250" y1="300" x2="550" y2="300" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="300" y1="320" x2="500" y2="320" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="620" cy="112" r="7" fill="#e9432e" opacity="0.8"/>
</svg>