<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2e3a"/>
      <stop offset="100%" stop-color="#171a22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <circle cx="400" cy="200" r="150" fill="#e9432e" opacity="0.15" filter="url(#glow)"/>

  <line x1="400" y1="120" x2="400" y2="80" stroke="#4a4f5c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="400" cy="74" r="12" fill="#e9432e" filter="url(#glow)"/>

  <rect x="300" y="130" width="200" height="150" rx="28" fill="url(#body)" stroke="#3a3f4d" stroke-width="2"/>
  <rect x="286" y="175" width="14" height="60" rx="6" fill="#2a2e3a"/>
  <rect x="500" y="175" width="14" height="60" rx="6" fill="#2a2e3a"/>

  <circle cx="360" cy="195" r="22" fill="#e9432e" filter="url(#glow)"/>
  <circle cx="440" cy="195" r="22" fill="#e9432e" filter="url(#glow)"/>
  <circle cx="360" cy="195" r="8" fill="#ffffff"/>
  <circle cx="440" cy="195" r="8" fill="#ffffff"/>

  <path d="M370 250 h60" stroke="#e9432e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="370" cy="250" r="4" fill="#e9432e"/>
  <circle cx="430" cy="250" r="4" fill="#e9432e"/>

  <g stroke="#2e3340" stroke-width="2" fill="none">
    <path d="M260 200 h24"/>
    <path d="M516 210 h24"/>
  </g>
  <circle cx="260" cy="200" r="4" fill="#e9432e" opacity="0.7"/>
  <circle cx="540" cy="210" r="4" fill="#e9432e" opacity="0.7"/>

  <circle cx="140" cy="106" r="7" fill="#e9432e"/>
